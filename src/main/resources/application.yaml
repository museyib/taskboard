spring:
  application:
    name: taskboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    generate-ddl: false
app:
  jwt:
    secretKey: ${JWT_SECRET_KEY:your-secret-key}
    accessTokenExpiration: ${ACCESS_TOKEN_EXPIRATION:3600000}       # 1 hour in ms
    refreshTokenExpiration: ${REFRESH_TOKEN_EXPIRATION:604800000}   # 7 days in ms
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true